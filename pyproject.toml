[build-system]
# setuptools>=77 provides PEP 639 license / license-files support
requires = ["setuptools>=77", "wheel", "pkgconfig>=1.5.5", "numpy>=1.21", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libtfr"
version = "2.2.0"
description = "Calculate multi-taper windowed and time-frequency reassignment spectrograms"
readme = "README.rst"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
authors = [
    {name = "C Daniel Meliza", email = "dan@meliza.org"},
]
maintainers = [
    {name = "C Daniel Meliza", email = "dan@meliza.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",    
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English"
]
dependencies = [
    "numpy>=2.0.2",
]

[project.urls]
homepage = "https://github.com/melizalab/libtfr"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.3",
]
# not in dev: uv installs dev by default, and the tests matrix has no use for these
docs = [
    "pdoc>=15",
    "ghp-import>=2.1",
]

[tool.ruff]
# apply the excludes below even when a path is named explicitly on the command
# line, so `ruff check attic/...` stays quiet too
force-exclude = true
line-length = 88
target-version = "py310"
extend-exclude = [
    "attic",
    "venv",
    "build",
]

[tool.ruff.lint]
extend-select = [
    "F",  # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
    "NPY201", # numpy 2.0
]

[tool.mypy]
ignore_missing_imports = true

[tool.cibuildwheel]
skip= "cp314t-*"
test-requires = "pytest"
test-command = "pytest {project}/test"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-i686-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
manylinux-pypy_x86_64-image = "manylinux_2_28"
manylinux-pypy_aarch64-image = "manylinux_2_28"
# enable pypy builds - no longer on by default
enable = "pypy"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux*"
before-all = "dnf install -y epel-release && dnf install -y fftw3-devel lapack-devel"

[[tool.cibuildwheel.overrides]]
select = "*musllinux*"
before-all = [
  "apk add fftw-dev lapack-dev",
]

[tool.cibuildwheel.macos]
before-all = [
  "curl -O http://fftw.org/fftw-3.3.10.tar.gz",
  "echo '56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467  fftw-3.3.10.tar.gz' | shasum -a 256 -c",
  "tar zxf fftw-3.3.10.tar.gz",
  "cd fftw-3.3.10",
  "./configure --enable-shared --disable-debug --enable-threads --disable-dependency-tracking",
  "make",
  "sudo make install"
]

[tool.cibuildwheel.windows]
before-all = "python -m pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
environment = { FFTW_PATH = "C:/fftw", LAPACK_PATH = "C:/lapack", PATH = "C:/fftw/bin;C:/lapack/bin;$PATH" }
before-build = [
  "powershell -Command \"Invoke-WebRequest -Uri 'http://fftw.org/fftw-3.3.10.tar.gz' -OutFile 'fftw-3.3.10.tar.gz'\"",
  "tar -xzf fftw-3.3.10.tar.gz",
  "cd fftw-3.3.10 && cmake -B build -DENABLE_SHARED=ON -DCMAKE_INSTALL_PREFIX=C:/fftw -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build --config Release && cmake --install build",
  "cd ..",
  "powershell -Command \"Invoke-WebRequest -Uri 'https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.34/OpenBLAS-0.3.34-x64.zip' -OutFile 'openblas.zip'\"",
  "powershell -Command \"Expand-Archive -Path 'openblas.zip' -DestinationPath 'C:/lapack' -Force\"",
  "powershell -Command \"Copy-Item 'C:/lapack/lib/libopenblas.lib' 'C:/lapack/lib/openblas.lib'\""  
]
